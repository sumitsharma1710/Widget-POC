<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Recorder Widget</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Error Display -->
    <div id="error-display" class="error-display hidden interactive">
        <div class="error-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <!-- Triangle -->
                <path d="M12 2L2 20H22L12 2Z" fill="#FFC107" />

                <!-- Exclamation line -->
                <rect x="11" y="8" width="2" height="6" fill="#000000" />

                <!-- Exclamation dot -->
                <circle cx="12" cy="17" r="1.5" fill="#000000" />
            </svg>
        </div>
        <div id="error-message" class="error-message">Error message here</div>
        <button id="error-close-btn" class="error-close-btn">×</button>
    </div>

    <!-- Compact Mode: Initial state with just two buttons -->
    <div id="compact-controls" class="compact-controls interactive">
        <div class="drag-handle">
            <div class="drag-dots"></div>
        </div>
        <button id="record-btn" class="icon-btn record-btn" title="Start Recording">
            <div class="record-icon"></div>
        </button>
        <button id="list-btn" class="icon-btn list-btn" title="View Recordings">
            <div class="list-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>
    </div>

    <!-- Recording Mode: Compact pill widget with controls -->
    <div id="recording-panel" class="recording-panel hidden interactive">
        <div class="drag-handle">
            <div class="drag-dots"></div>
        </div>
        <div class="widget-wrapper" id="widget-container">

            <!-- The Pill Widget -->
            <div class="audio-widget">

                <!-- Mic Dropdown Trigger -->
                <button id="mic-toggle-btn" class="mic-trigger" title="Select Microphone">
                    <!-- Mic Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" x2="12" y1="19" y2="22" />
                    </svg>
                    <!-- Chevron Down Icon -->
                    <svg id="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </button>

                <!-- Divider -->
                <div class="divider"></div>

                <!-- Status & Timer -->
                <div class="status-container">
                    <div class="recording-dot">
                        <span class="dot-ping"></span>
                        <span class="dot-solid"></span>
                    </div>
                    <span id="recording-time" class="timer">00:00</span>
                </div>

                <!-- Divider -->
                <div class="divider small-margin"></div>

                <!-- Actions -->
                <div class="actions-container">
                    <!-- Play/Pause Button -->
                    <button id="pause-recording-btn" class="action-btn">
                        <!-- Pause Icon (shown when recording) -->
                        <svg class="pause-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            title="Pause" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                            <rect x="6" y="4" width="4" height="16" />
                            <rect x="14" y="4" width="4" height="16" />
                        </svg>
                        <!-- Play Icon (shown when paused) -->
                        <svg class="play-icon-svg hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            title="Resume" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                            <path d="M6 3L20 12L6 21V3Z" />
                        </svg>
                    </button>

                    <!-- Cancel Button -->
                    <button id="cancel-recording-btn" class="action-btn btn-cancel" title="Cancel">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                        </svg>
                    </button>

                    <!-- Finish/Done Button -->
                    <button id="done-recording-btn" class="action-btn btn-finish" title="Finish">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 6 9 17l-5-5" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mic Selector Dropdown -->
            <div id="mic-selector" class="dropdown-menu hidden interactive">
                <!-- Header -->
                <div class="dropdown-header">
                    <span class="dropdown-title">Select Microphone</span>
                </div>

                <!-- Mic List (dynamically populated by widget.js) -->
                <div id="mic-list" class="mic-list">
                    <!-- Mic options will be inserted here -->
                </div>

                <!-- Footer / Settings -->
                <div class="dropdown-footer">
                    <button class="settings-btn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 7h-9" />
                            <path d="M14 17H5" />
                            <circle cx="17" cy="17" r="3" />
                            <circle cx="7" cy="7" r="3" />
                        </svg>
                        <span>Audio Settings...</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Recordings List Panel -->
    <div id="recordings-panel" class="recordings-panel hidden interactive">
        <div class="drag-handle"></div>
        <div class="panel-header">
            <h3>recent recordings</h3>
            <button id="close-list-btn" class="close-btn">×</button>
        </div>
        <div id="recordings-list" class="recordings-list">
            <!-- Recordings will be dynamically inserted here -->
        </div>
        <button id="see-more-btn" class="see-more-btn">see more</button>
    </div>

    <!-- Scripts -->
    <script src="audio-recorder.js"></script>
    <script src="widget.js"></script>
</body>

</html>
